# Iceberg Catalog Configuration
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Iceberg custom catalog (for spark-submit scripts)
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type=hadoop
spark.sql.catalog.iceberg.warehouse=/opt/data/warehouse

# Override spark_catalog with Iceberg support (for dbt via Thrift)
spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type=hive
spark.sql.catalog.spark_catalog.lock-impl=org.apache.iceberg.hadoop.HadoopLockManager
spark.sql.catalog.spark_catalog.lock.hadoop.fs.root=/opt/data/warehouse

spark.sql.defaultCatalog=spark_catalog

# Enable Hive Thrift Server (for dbt-spark connection)
spark.sql.hive.thriftServer.singleSession=true
spark.hive.server2.authentication=NOSASL

# Performance tuning
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.driver.memory=2g
spark.executor.memory=2g
