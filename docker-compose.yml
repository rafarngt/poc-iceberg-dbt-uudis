services:

  # ─────────────────────────────────────────────
  # MinIO — Object storage S3-compatible
  # Warehouse de Iceberg: s3a://warehouse/
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # MinIO Init — Crea el bucket 'warehouse'
  # ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'Bucket warehouse created OK'
      "

  # ─────────────────────────────────────────────
  # Spark Thrift Server
  # Iceberg hadoop catalog → s3a://warehouse/
  # dbt conecta aquí via Thrift (NOSASL, puerto 10000)
  # ─────────────────────────────────────────────
  spark-thrift:
    build: .
    image: spark-iceberg-dbt:latest
    container_name: spark_thrift_server
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./dbt_project:/dbt_project
      - ./scripts:/scripts
    ports:
      - "4040:4040"
      - "10000:10000"
    environment:
      - SPARK_HOME=/opt/spark
      - DBT_PROFILES_DIR=/dbt_project
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command:
      - bash
      - -c
      - |
        spark-submit \
          --master local[*] \
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
          --conf spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog \
          --conf spark.sql.catalog.spark_catalog.type=hadoop \
          --conf spark.sql.catalog.spark_catalog.warehouse=s3a://warehouse/ \
          --conf spark.sql.defaultCatalog=spark_catalog \
          --conf spark.sql.warehouse.dir=s3a://warehouse/ \
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
          --conf spark.hadoop.fs.s3a.access.key=minioadmin \
          --conf spark.hadoop.fs.s3a.secret.key=minioadmin \
          --conf spark.hadoop.fs.s3a.path.style.access=true \
          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
          --conf spark.sql.hive.thriftServer.singleSession=true \
          --conf "spark.driver.extraJavaOptions=-Dhive.server2.authentication=NOSASL" \
          /scripts/thrift_with_udfs.py
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/10000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # dbt runner
  # docker exec -it dbt_runner dbt run
  # ─────────────────────────────────────────────
  dbt:
    build: .
    image: spark-iceberg-dbt:latest
    container_name: dbt_runner
    depends_on:
      spark-thrift:
        condition: service_healthy
    volumes:
      - ./dbt_project:/dbt_project
      - ./scripts:/scripts
    environment:
      - SPARK_HOME=/opt/spark
      - DBT_PROFILES_DIR=/dbt_project
    working_dir: /dbt_project
    command: tail -f /dev/null

volumes:
  minio_data:
